<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>AnyRouter Keeper</title>
    <script>
      (() => {
        const applyTheme = (appTheme) => {
          const colorScheme = appTheme === "classic-dark" ? "dark" : "light";
          document.documentElement.dataset.appTheme = appTheme;
          document.documentElement.dataset.theme = colorScheme;
          document.documentElement.style.colorScheme = colorScheme;
        };

        try {
          const appThemeKey = "anyrouter-keeper-app-theme";
          const legacyThemeKey = "anyrouter-keeper-theme-mode";
          const storedAppTheme = localStorage.getItem(appThemeKey);
          const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
          const legacyTheme = localStorage.getItem(legacyThemeKey);
          const appTheme =
            storedAppTheme === "classic-light" ||
            storedAppTheme === "classic-dark" ||
            storedAppTheme === "liquid-glass-light"
              ? storedAppTheme
              : legacyTheme === "dark" || (legacyTheme === "system" && systemDark)
                ? "classic-dark"
                : "classic-light";
          if (!storedAppTheme && (legacyTheme === "light" || legacyTheme === "dark" || legacyTheme === "system")) {
            try {
              localStorage.setItem(appThemeKey, appTheme);
            } catch {
              // Continue with the resolved theme when storage is unavailable.
            }
          }
          applyTheme(appTheme);
        } catch {
          applyTheme("classic-light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
