[package]
name = "anyrouter-claude-keeper"
version = "0.1.11"
description = "AnyRouter Claude Code activity keeper"
authors = ["chaochen"]
edition = "2021"

[lib]
name = "anyrouter_claude_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anyrouter-claude-keeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
chrono = { version = "0.4.39", features = ["clock", "serde"] }
dirs = "5.0.1"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "sync-secret-service"] }
once_cell = "1.20.2"
rand = "0.8.5"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tauri = { version = "2.2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.2.0"
tauri-plugin-opener = "2.2.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.2.0"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14.0"
